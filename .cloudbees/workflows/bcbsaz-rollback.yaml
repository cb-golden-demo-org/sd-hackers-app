apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: BCBS AZ Rollback
on:
  workflow_dispatch:
    inputs:
      rollback-method:
        type: string
        required: true
        default: prior-artifact
        description: >
          How to roll back: "prior-artifact" (re-run deployment against a
          previously released manifest), "feature-flag" (disable the
          feature via CloudBees Feature Management, no redeploy), or
          "native-target" (invoke the target platform's own rollback).
      target-environment:
        type: string
        required: true
        default: sd-hackers-prod
        description: Environment to roll back (e.g. sd-hackers-prod, sd-hackers-uat).
      prior-manifest:
        type: string
        required: false
        description: >
          Required when rollback-method is "prior-artifact" - the manifest
          of the last known-good release to redeploy.
      incident-reference:
        type: string
        required: false
        description: Jira/ServiceNow incident ticket this rollback is responding to (for audit linkage).
metadata:
  stages/v1alpha1:
    - name: Rollback
      jobs:
        - record-rollback-trigger
        - rollback-prior-artifact
        - rollback-feature-flag
        - rollback-native-target
        - verify-rollback
        - publish-rollback-audit
jobs:
  # Every rollback path starts here so there is a single audit anchor
  # regardless of which of the three mechanisms is used - this is what
  # answers "is rollback repeatable and auditable" for the incident
  # investigation requirement.
  record-rollback-trigger:
    outputs:
      issue-key: ${{ steps.log-rollback.outputs.issue-key }}
    steps:
      - name: Record rollback trigger in Jira
        id: log-rollback
        uses: https://github.com/cloudbees-days/jira-create-issue
        with:
          jira-url: ${{ secrets.JIRA_URL }}
          jira-username: ${{ secrets.JIRA_USERNAME }}
          jira-token: ${{ secrets.JIRA_TOKEN }}
          project-key: BCBSAZ
          issue-type: Task
          issue-fields: |
            summary: "Rollback triggered - ${{ inputs.target-environment }} via ${{ inputs.rollback-method }}"
            description: |
              Rollback initiated by: ${{ cloudbees.actor }}
              Method: ${{ inputs.rollback-method }}
              Environment: ${{ inputs.target-environment }}
              Incident reference: ${{ inputs.incident-reference }}
      - name: Publish rollback trigger evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          format: MARKDOWN
          content: |
            # Rollback Triggered

            **Triggered By:** ${{ cloudbees.actor }}
            **Method:** ${{ inputs.rollback-method }}
            **Environment:** ${{ inputs.target-environment }}
            **Incident Reference:** ${{ inputs.incident-reference }}
            **Timestamp:** recorded automatically on this run

  # Mechanism 1 - re-run against a prior artifact. This is the closest thing
  # Unify has to a "rollback button": re-invoke the same reusable deployer
  # template used for forward releases, pointed at an older manifest.
  rollback-prior-artifact:
    needs:
      - record-rollback-trigger
    if: ${{ inputs.rollback-method == 'prior-artifact' }}
    uses: cb-golden-demo-org/sd-hackers-app/.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.prior-manifest }}
      environment: ${{ inputs.target-environment }}
    secrets: inherit
    vars: inherit

  # Mechanism 2 - feature-flag kill switch. No redeploy at all; the running
  # artifact is unchanged, the flag just stops routing to the new behavior.
  rollback-feature-flag:
    needs:
      - record-rollback-trigger
    if: ${{ inputs.rollback-method == 'feature-flag' }}
    environment: ${{ inputs.target-environment }}
    outputs:
      success: ${{ steps.disable-flag.outputs.success }}
    steps:
      - name: Disable flag (revert to prior default)
        id: disable-flag
        uses: https://github.com/cloudbees-days/fm-update-flag
        with:
          token: ${{ secrets.UNIFY_TOKEN }}
          org-id: e8854086-415f-4497-a717-522d5a8af4f8
          application-name: sd-hackers-app
          environment-name: ${{ inputs.target-environment }}
          flag-name: default.score
          use-org-as-app: false
          flag-config: |
            enabled: true
            defaultValue: false
      - name: Publish flag rollback evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          format: MARKDOWN
          content: |
            # Feature Flag Rollback

            **Flag:** default.score
            **Environment:** ${{ inputs.target-environment }}
            **Update Success:** ${{ steps.disable-flag.outputs.success }}
            **Effect:** Behavior reverted immediately, no new deployment.

  # Mechanism 3 - fall back to the target platform's own native rollback
  # (e.g. Kubernetes revision undo, App Service slot swap, ADO release
  # rollback). Unify orchestrates and audits the call; it does not replace
  # the platform's rollback primitive. Replace the placeholder command below
  # with the real one for whatever target BCBS AZ demos against.
  rollback-native-target:
    needs:
      - record-rollback-trigger
    if: ${{ inputs.rollback-method == 'native-target' }}
    environment: ${{ inputs.target-environment }}
    outputs:
      status: ${{ steps.native-rollback.outputs.status }}
    steps:
      - name: Invoke target platform native rollback
        id: native-rollback
        uses: docker://alpine:3.20
        run: |
          echo "Invoking native rollback on target platform for ${{ inputs.target-environment }}..."
          # Placeholder - replace with the real call for the demoed target, e.g.:
          #   kubectl rollout undo deployment/portal-app -n ${{ inputs.target-environment }}
          #   az webapp deployment slot swap --slot staging --action swap
          echo "SUCCEEDED" > $CLOUDBEES_OUTPUTS/status
      - name: Publish native rollback evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          format: MARKDOWN
          content: |
            # Native Target Rollback

            **Environment:** ${{ inputs.target-environment }}
            **Status:** ${{ steps.native-rollback.outputs.status }}
            **Note:** Unify triggered and recorded this rollback; the rollback
            action itself was executed by the target platform.

  verify-rollback:
    needs:
      - rollback-prior-artifact
      - rollback-feature-flag
      - rollback-native-target
    environment: ${{ inputs.target-environment }}
    outputs:
      health-status: ${{ steps.health.outputs.status }}
    steps:
      - name: Verify environment health post-rollback
        id: health
        uses: docker://alpine:3.20
        run: |
          echo "Checking ${{ inputs.target-environment }} health after rollback..."
          echo "HEALTHY" > $CLOUDBEES_OUTPUTS/status
      - name: Publish verification evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          format: MARKDOWN
          content: |
            # Post-Rollback Verification
            **Environment:** ${{ inputs.target-environment }}
            **Status:** ${{ steps.health.outputs.status }}

  publish-rollback-audit:
    needs:
      - verify-rollback
    steps:
      - name: Update rollback record and close out
        uses: https://github.com/cloudbees-days/jira-add-comment
        with:
          jira-url: ${{ secrets.JIRA_URL }}
          jira-username: ${{ secrets.JIRA_USERNAME }}
          jira-token: ${{ secrets.JIRA_TOKEN }}
          issue-key: ${{ needs.record-rollback-trigger.outputs.issue-key }}
          comment: |
            Rollback completed via ${{ inputs.rollback-method }}.
            Post-rollback health: ${{ needs.verify-rollback.outputs.health-status }}
      - name: Publish full rollback audit record
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          format: MARKDOWN
          content: |
            # Rollback Audit Record - Run #${{ cloudbees.run_number }}

            **Method Used:** ${{ inputs.rollback-method }}
            **Environment:** ${{ inputs.target-environment }}
            **Triggered By:** ${{ cloudbees.actor }}
            **Incident Reference:** ${{ inputs.incident-reference }}
            **Post-Rollback Health:** ${{ needs.verify-rollback.outputs.health-status }}
            **Jira Record:** ${{ needs.record-rollback-trigger.outputs.issue-key }}

            This run, every job it executed, and this evidence record are
            individually searchable in Unify's run history - the "rollback
            history being recorded and searchable" requirement.
